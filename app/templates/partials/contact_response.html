{% if success %}
<div class="rounded-lg bg-emerald-500/10 border border-emerald-500/30 p-4 text-emerald-400" role="status">
    <div class="flex items-center gap-2">
        <svg class="h-5 w-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        <p class="font-medium">{{ message }}</p>
    </div>
</div>
{% else %}
<div class="rounded-lg bg-red-500/10 border border-red-500/30 p-4 text-red-400" role="alert">
    <div class="flex items-center gap-2">
        <svg class="h-5 w-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
        <p class="font-medium">{{ error or "Erro ao enviar mensagem. Tente novamente." }}</p>
    </div>
{% endif %}
