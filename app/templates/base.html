<!DOCTYPE html>
<html lang="{{ locale }}" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ company.description(locale) if company else 'ALVI - Software House' }}">
    <title>{% block title %}{{ settings.app_name }}{% endblock %}</title>

    {% if settings.tailwind_cdn %}
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: {
                            DEFAULT: '#000000',
                            soft: '#121212',
                            mid: '#1a1a1a',
                        },
                        chalk: {
                            DEFAULT: '#FAFAFA',
                            dim: 'rgba(250,250,250,0.55)',
                            faint: 'rgba(250,250,250,0.15)',
                            rule: 'rgba(250,250,250,0.10)',
                        }
                    },
                    fontFamily: {
                        heading: ['Montserrat', 'sans-serif'],
                        sans: ['Montserrat', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    {% else %}
    <link rel="stylesheet" href="{{ url_for('static', path='/css/output.css') }}">
    {% endif %}

    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>

    <style>
        :root {
            --ink: #000000;
            --ink-soft: #121212;
            --chalk: #FAFAFA;
            --chalk-dim: rgba(250,250,250,0.55);
            --chalk-faint: rgba(250,250,250,0.15);
            --chalk-rule: rgba(250,250,250,0.10);
        }

        /* Reveal animation */
        .reveal {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1);
        }
        .reveal-visible {
            opacity: 1;
            transform: translateY(0);
        }
        .reveal-delay-1 { transition-delay: 80ms; }
        .reveal-delay-2 { transition-delay: 160ms; }
        .reveal-delay-3 { transition-delay: 240ms; }
        .reveal-delay-4 { transition-delay: 320ms; }
        .reveal-delay-5 { transition-delay: 400ms; }
        .reveal-delay-6 { transition-delay: 480ms; }

        /* Prose overrides for dark-on-dark content blocks */
        .prose-chalk { color: var(--chalk-dim); }
        .prose-chalk h1, .prose-chalk h2, .prose-chalk h3,
        .prose-chalk h4, .prose-chalk strong { color: var(--chalk); }
        .prose-chalk p { color: var(--chalk-dim); }

        @media (prefers-reduced-motion: reduce) {
            .reveal {
                opacity: 1;
                transform: none;
                transition: none;
            }
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body class="bg-black text-white font-sans antialiased relative selection:bg-white selection:text-black" x-data="{ mobileMenuOpen: false }">
    <!-- 3D Geodesic Sphere Background Experience -->
    <canvas id="webgl-sphere" class="fixed inset-0 w-full h-full pointer-events-none" style="z-index: 0;"></canvas>

    <!-- Page Content (layered seamlessly over 3D sphere) -->
    <div class="relative z-10 flex flex-col min-h-screen">
        {% include "partials/navigation.html" %}

        <main id="main-content" class="flex-grow">
            {% block content %}{% endblock %}
        </main>

        {% include "partials/footer.html" %}
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('reveal-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        });
    </script>

    <!-- Three.js & 3D Interactive Sphere Engine -->
    <script src="{{ url_for('static', path='/js/three.min.js') }}"></script>
    <script src="{{ url_for('static', path='/js/sphere-scene.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
