[project]
name = "huge2"
version = "0.1.0"
description = "HUGE - Software House Website"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy==2.0.36",
    "alembic==1.13.2",
    "asyncpg==0.29.0",
    "aiosqlite==0.20.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "jinja2==3.1.4",
    "python-multipart==0.0.9",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "httpx==0.27.2",
    "ruff==0.6.9",
    "black==24.10.0",
    "mypy==1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "UP", "B", "C4", "PTH", "SIM", "T20"]
lint.ignore = ["S101", "PTH118", "PTH123"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.alembic]
script_location = "alembic"
prepend_sys_path = "."
version_path_separator = "os"
file_template = "%%Y%%m%%d_%%H%%M%%S_%%m"